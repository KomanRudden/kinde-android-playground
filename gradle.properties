org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The SDK module still uses the kotlin-android plugin and the legacy DSL; these
# must match kinde-sdk-android/gradle.properties for it to build from source here.
android.builtInKotlin=false
android.newDsl=false

# Build against a published SDK instead of ../kinde-sdk-android:
# kindeSdkVersion=2.2.0
# Or point at a checkout somewhere else:
# kindeSdkPath=../kinde-sdk-android
